<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Editor Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b14;color:white;font-family:Arial,sans-serif}
header{padding:22px;background:#151326;border-bottom:1px solid #38265c}
h1{margin:0;color:#c5a5ff}
header p{color:#bdb5d1}
main{max-width:850px;margin:auto;padding:18px}
.card{background:#151522;border:1px solid #39304f;border-radius:18px;padding:18px;margin-bottom:18px}
h2{margin-top:0}
button,.upload{display:inline-block;background:#8247ff;color:white;border:0;border-radius:10px;padding:12px 16px;margin:5px 3px;font-weight:bold;cursor:pointer}
input[type=file]{max-width:100%;margin:12px 0}
input[type=range]{width:100%}
canvas{width:100%;height:auto;background:#222;border-radius:12px;margin-top:12px}
label{display:block;margin-top:14px;color:#ddd}
textarea{width:100%;min-height:95px;background:#0d0d19;color:white;border:1px solid #51416c;border-radius:10px;padding:12px}
.note{color:#aaa;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>✨ AI Editor Pro</h1>
<p>Your creative studio — right in your browser.</p>
</header>
<main>
<section class="card">
<h2>🖼️ Photo Editor</h2>
<input id="file" type="file" accept="image/*">
<canvas id="canvas"></canvas>
<label>Brightness <span id="bv">100%</span></label>
<input id="brightness" type="range" min="0" max="200" value="100">
<label>Contrast <span id="cv">100%</span></label>
<input id="contrast" type="range" min="0" max="200" value="100">
<label>Saturation <span id="sv">100%</span></label>
<input id="saturation" type="range" min="0" max="200" value="100">
<div>
<button onclick="rotate()">↻ Rotate</button>
<button onclick="reset()">Reset</button>
<button onclick="download()">⬇ Download PNG</button>
</div>
<p class="note">Choose a photo to edit. Your photo stays in this browser.</p>
</section>
<section class="card">
<h2>🤖 AI Prompt Studio</h2>
<textarea id="prompt" placeholder="Describe your image idea..."></textarea>
<button onclick="makePrompt()">Create Prompt</button>
<p id="result"></p>
<p class="note">AI image generation needs a connected AI service. This demo prepares your prompt but does not generate an image yet.</p>
</section>
</main>
<script>
const file=document.getElementById('file');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let img=new Image(),loaded=false,angle=0;
const b=document.getElementById('brightness');
const c=document.getElementById('contrast');
const s=document.getElementById('saturation');
file.onchange=e=>{
const f=e.target.files[0];if(!f)return;
const url=URL.createObjectURL(f);
img.onload=()=>{loaded=true;angle=0;canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;draw();URL.revokeObjectURL(url)};
img.src=url;
};
function draw(){
if(!loaded)return;
document.getElementById('bv').textContent=b.value+'%';
document.getElementById('cv').textContent=c.value+'%';
document.getElementById('sv').textContent=s.value+'%';
const rad=angle*Math.PI/180;
const w=img.naturalWidth,h=img.naturalHeight;
canvas.width=angle%180===0?w:h;canvas.height=angle%180===0?h:w;
ctx.save();ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rad);
ctx.filter=`brightness(${b.value}%) contrast(${c.value}%) saturate(${s.value}%)`;
ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();ctx.filter='none';
}
[b,c,s].forEach(x=>x.oninput=draw);
function rotate(){if(!loaded)return alert('Please choose a photo first.');angle=(angle+90)%360;draw()}
function reset(){b.value=c.value=s.value=100;angle=0;draw()}
function download(){if(!loaded)return alert('Please choose a photo first.');const a=document.createElement('a');a.download='ai-editor-pro.png';a.href=canvas.toDataURL('image/png');a.click()}
function makePrompt(){const p=document.getElementById('prompt').value.trim();document.getElementById('result').textContent=p?'Your prompt: '+p:'Please enter an image idea first.'}
</script>
</body>
                                             </html>
